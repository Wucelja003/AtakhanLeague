<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/MainLogoAtakhan.png" />

    <!-- Fonts requested straight from the HTML rather than through an @import
         inside index.css. That import couldn't even be discovered until the
         stylesheet had downloaded and parsed, which put the fonts a full
         round-trip behind the render. -->
    <!-- The hero backdrop is rendered by React, so without this the browser
         can't even discover it until the bundle has parsed. It's the largest
         thing on the landing page, so that discovery delay lands on LCP. -->
    <link rel="preload" as="image" href="/atakhan-bg-poster.jpg" fetchpriority="high" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fetched without blocking the first paint: as print it isn't render
         critical, and it's promoted to all once it lands. The families all use
         display=swap, so text draws in a fallback immediately and swaps. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oxanium:wght@400;700&family=Exo+2:wght@400;700&family=Inter:wght@700&family=Orbitron:wght@400;700&family=Cinzel:wght@500;600&display=swap"
      media="print"
      onload="this.media='all';this.onload=null"
    />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oxanium:wght@400;700&family=Exo+2:wght@400;700&family=Inter:wght@700&family=Orbitron:wght@400;700&family=Cinzel:wght@500;600&display=swap" /></noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />
    <title>Atakhan League — LoL Tournament Platform</title>
    <meta name="description" content="Atakhan League — the League of Legends tournament platform for every summoner. Register teams or sign up solo, climb the bracket, and compete for glory." />

    <!-- Open Graph fallback -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Atakhan League" />
    <meta property="og:image" content="https://atakhanleague.com/atakhanbanner.png"/>

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3CHGRNN35H"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-3CHGRNN35H', { send_page_view: false });
    </script>

    <!-- Structured data — Organization schema for Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Atakhan League",
      "url": "https://atakhanleague.com",
      "logo": "https://atakhanleague.com/MainLogoAtakhan.png",
      "description": "Community-run League of Legends tournament platform.",
      "sameAs": [
        "https://discord.gg/WuNn2G8PxY"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
